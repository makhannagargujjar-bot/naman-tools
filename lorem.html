<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <title>Lorem Ipsum Generator | Naman Tools</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="lorem-body">

    <!-- =================================
         TOOL HEADER
    ================================= -->

    <header class="tool-top-header">

        <a href="index.html" class="tool-brand">

            <span class="tool-brand-icon">
                NT
            </span>

            <span class="tool-brand-name">
                Naman Tools
            </span>

        </a>

        <a href="index.html" class="tool-back">

            <span>←</span>
            <span>Back</span>

        </a>

    </header>


    <!-- =================================
         MAIN
    ================================= -->

    <main class="lorem-page">

        <!-- HERO -->

        <section class="lorem-hero">

            <div class="lorem-icon">
                Aa
            </div>

            <h1>
                Lorem Ipsum Generator
            </h1>

            <p>
                Generate placeholder text for your
                websites, designs and projects instantly.
            </p>

        </section>


        <!-- TOOL CARD -->

        <section class="lorem-card">

            <!-- OPTIONS -->

            <div class="lorem-options">

                <div class="lorem-input-box">

                    <label for="loremAmount">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="loremAmount"
                        min="1"
                        max="50"
                        value="3"
                    >

                </div>


                <div class="lorem-input-box">

                    <label for="loremType">
                        Type
                    </label>

                    <select id="loremType">

                        <option value="paragraphs">
                            Paragraphs
                        </option>

                        <option value="sentences">
                            Sentences
                        </option>

                        <option value="words">
                            Words
                        </option>

                    </select>

                </div>

            </div>


            <!-- GENERATE -->

            <button
                type="button"
                id="generateLorem"
                class="lorem-primary-btn"
            >
                Generate Text
            </button>


            <!-- RESULT -->

            <div class="lorem-result-box">

                <div class="lorem-result-header">

                    <span>
                        Generated Text
                    </span>

                    <button
                        type="button"
                        id="copyLorem"
                    >
                        Copy
                    </button>

                </div>


                <textarea
                    id="loremResult"
                    readonly
                    spellcheck="false"
                    placeholder="Your generated text will appear here..."
                ></textarea>

            </div>


            <!-- STATUS -->

            <div
                id="loremStatus"
                class="lorem-status"
            ></div>


            <!-- CLEAR -->

            <button
                type="button"
                id="clearLorem"
                class="lorem-clear-btn"
            >
                Clear
            </button>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
