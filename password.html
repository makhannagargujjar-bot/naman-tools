<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <title>Password Generator | Naman Tools</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="password-page-body">


    <!-- PREMIUM TOOL HEADER -->

    <header class="tool-top-header">

        <a href="index.html" class="tool-brand">

            <span class="tool-brand-icon">
                NT
            </span>

            <span class="tool-brand-name">
                Naman Tools
            </span>

        </a>


        <a href="index.html" class="tool-back">

            <span>←</span>

            <span>Back</span>

        </a>

    </header>



    <!-- MAIN -->

    <main class="password-page">


        <!-- HERO -->

        <section class="password-hero">

            <div class="password-icon">
                🔐
            </div>

            <h1>
                Password Generator
            </h1>

            <p>
                Create strong and secure passwords
                instantly.
            </p>

        </section>



        <!-- PASSWORD CARD -->

        <section class="password-card">


            <!-- GENERATED PASSWORD -->

            <div class="password-output">

                <input
                    type="text"
                    id="passwordOutput"
                    value=""
                    placeholder="Your password"
                    readonly
                >

                <button
                    type="button"
                    id="copyPassword"
                    class="copy-password"
                    aria-label="Copy password"
                >
                    📋
                </button>

            </div>


            <div
                id="copyMessage"
                class="copy-message"
            ></div>



            <!-- LENGTH -->

            <div class="password-setting">

                <div class="setting-top">

                    <label for="passwordLength">
                        Password Length
                    </label>

                    <strong id="lengthValue">
                        16
                    </strong>

                </div>


                <input
                    type="range"
                    id="passwordLength"
                    min="6"
                    max="64"
                    value="16"
                >

            </div>



            <!-- OPTIONS -->

            <div class="password-options">


                <label class="password-option">

                    <input
                        type="checkbox"
                        id="uppercase"
                        checked
                    >

                    <span class="custom-check">
                        ✓
                    </span>

                    <span>
                        Uppercase
                    </span>

                </label>



                <label class="password-option">

                    <input
                        type="checkbox"
                        id="lowercase"
                        checked
                    >

                    <span class="custom-check">
                        ✓
                    </span>

                    <span>
                        Lowercase
                    </span>

                </label>



                <label class="password-option">

                    <input
                        type="checkbox"
                        id="numbers"
                        checked
                    >

                    <span class="custom-check">
                        ✓
                    </span>

                    <span>
                        Numbers
                    </span>

                </label>



                <label class="password-option">

                    <input
                        type="checkbox"
                        id="symbols"
                        checked
                    >

                    <span class="custom-check">
                        ✓
                    </span>

                    <span>
                        Symbols
                    </span>

                </label>

            </div>



            <!-- STRENGTH -->

            <div class="password-strength">

                <div class="strength-top">

                    <span>
                        Password Strength
                    </span>

                    <strong id="strengthText">
                        Strong
                    </strong>

                </div>


                <div class="strength-bar">

                    <span
                        id="strengthBar"
                    ></span>

                </div>

            </div>



            <!-- GENERATE -->

            <button
                type="button"
                id="generatePassword"
                class="generate-password"
            >
                🔄 Generate Password
            </button>


        </section>


    </main>



    <script src="script.js"></script>

</body>

</html>
