<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <title>Timestamp Converter | Naman Tools</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="timestamp-body">


    <!-- =================================
         TOOL HEADER
    ================================= -->

    <header class="tool-top-header">

        <a href="index.html" class="tool-brand">

            <span class="tool-brand-icon">
                NT
            </span>

            <span class="tool-brand-name">
                Naman Tools
            </span>

        </a>


        <a href="index.html" class="tool-back">

            <span>←</span>
            <span>Back</span>

        </a>

    </header>



    <!-- =================================
         MAIN
    ================================= -->

    <main class="timestamp-page">


        <!-- HERO -->

        <section class="timestamp-hero">

            <div class="timestamp-icon">
                ⏱
            </div>

            <h1>
                Timestamp Converter
            </h1>

            <p>
                Convert Unix timestamps to date and time,
                or convert date and time into Unix timestamp.
            </p>

        </section>



        <!-- =================================
             CARD
        ================================= -->

        <section class="timestamp-card">


            <!-- =================================
                 TIMESTAMP → DATE
            ================================= -->

            <div class="timestamp-section">

                <h2>
                    Unix Timestamp → Date
                </h2>

                <label for="timestampInput">
                    Unix Timestamp
                </label>

                <input
                    type="number"
                    id="timestampInput"
                    placeholder="Example: 1754563200"
                >

                <button
                    type="button"
                    id="timestampToDate"
                    class="timestamp-primary-btn"
                >
                    Convert to Date
                </button>

                <div
                    id="dateResult"
                    class="timestamp-result"
                >
                    Result will appear here
                </div>

            </div>



            <div class="timestamp-divider"></div>



            <!-- =================================
                 DATE → TIMESTAMP
            ================================= -->

            <div class="timestamp-section">

                <h2>
                    Date → Unix Timestamp
                </h2>

                <label for="dateInput">
                    Select Date & Time
                </label>

                <input
                    type="datetime-local"
                    id="dateInput"
                >

                <button
                    type="button"
                    id="dateToTimestamp"
                    class="timestamp-primary-btn"
                >
                    Convert to Timestamp
                </button>

                <div
                    id="timestampResult"
                    class="timestamp-result"
                >
                    Result will appear here
                </div>

            </div>



            <!-- =================================
                 CURRENT TIMESTAMP
            ================================= -->

            <div class="current-timestamp-box">

                <span>
                    Current Unix Timestamp
                </span>

                <strong id="currentTimestamp">
                    0
                </strong>

            </div>



            <!-- CLEAR -->

            <button
                type="button"
                id="clearTimestamp"
                class="timestamp-clear-btn"
            >
                Clear
            </button>


        </section>

    </main>



    <script src="script.js"></script>

</body>

</html>
